name: Selenium cross-browser

on:
  push:
    branches: [main]
    paths:
      - "04-selenium-case-study/**"
      - ".github/workflows/selenium.yml"
  pull_request:
    branches: [main]
    paths:
      - "04-selenium-case-study/**"
      - ".github/workflows/selenium.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selenium:
    name: Selenium / ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chrome
          - firefox

    defaults:
      run:
        working-directory: 04-selenium-case-study

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: 04-selenium-case-study/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Print runtime versions
        shell: bash
        run: |
          python --version
          python -c "import selenium; print('Selenium', selenium.__version__)"
          pytest --version
          if [ "${{ matrix.browser }}" = "chrome" ]; then
            google-chrome --version
          else
            firefox --version
          fi

      - name: Run Selenium test suite
        run: >-
          pytest
          --browser "${{ matrix.browser }}"
          --headless
          --junitxml "reports/junit-${{ matrix.browser }}.xml"

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selenium-junit-${{ matrix.browser }}
          path: 04-selenium-case-study/reports/junit-${{ matrix.browser }}.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: selenium-failure-screenshots-${{ matrix.browser }}
          path: 04-selenium-case-study/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 14
