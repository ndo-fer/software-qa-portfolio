name: nopcommerce-qa

services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-CU20-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa
          -P "$${MSSQL_SA_PASSWORD}" -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - nopcommerce_database:/var/opt/mssql
    restart: unless-stopped

  storefront:
    image: nopcommerceteam/nopcommerce:4.90.6
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${NOPCOMMERCE_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - nopcommerce_app_data:/app/App_Data
    restart: unless-stopped

volumes:
  nopcommerce_app_data:
  nopcommerce_database:
